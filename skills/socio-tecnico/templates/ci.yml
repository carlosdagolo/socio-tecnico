# Plantilla para .NET + PostgreSQL. Adáptala al stack (setup-node, setup-python...).
# Fija cada acción por SHA (no por etiqueta) y anota la versión al lado.
name: CI

on:
  push:
    branches: ["feat/**", "fix/**", "chore/**", "dev"]
  pull_request:
    branches: ["dev", "main"]

permissions:
  contents: read

# Un push nuevo a la misma rama cancela la corrida anterior (ahorra minutos).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      # BD desechable del job: sin contraseña ni secretos.
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: App_Test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=App_Test;Username=postgres
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"

    steps:
      - uses: actions/checkout@<SHA> # vX.Y.Z
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@<SHA> # vX.Y.Z
        with:
          global-json-file: global.json

      - run: dotnet restore
      # Release, como en producción.
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release --logger trx --results-directory TestResults

      - if: failure()
        uses: actions/upload-artifact@<SHA> # vX.Y.Z
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 7
